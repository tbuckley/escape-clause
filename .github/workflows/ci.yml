name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Parse-check every module, including the ones without unit coverage
      # (broker.mjs, server.mjs, ...). Catches syntax errors early.
      - name: Syntax check
        run: |
          for f in *.mjs tests/*.mjs; do
            node --check "$f"
          done

      # Both suites run on bare Node against throwaway stores/workspaces —
      # no npm install, no network, no broker install required.
      - name: Guard unit tests
        run: node tests/guard-test.mjs

      - name: Setup unit tests
        run: node tests/setup-test.mjs
