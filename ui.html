<!doctype html>
<!-- Approval UI, served verbatim by server.mjs. Same rules as ever: single
     self-contained page — no framework, no build step, no external requests. Auth is the
     HttpOnly session cookie; page JS never sees a credential, it only posts the password
     once at login. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light"><meta name="theme-color" content="#16181c">
<title>Escape Clause broker — approvals</title>
<style>
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f4f5f7;color:#1b1e22}
  header{background:#16181c;color:#fff;padding:12px max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600}
  #authstate{font-size:12px;color:#e8b84d}
  #authstate button{background:none;border:1px solid #555;color:#ccc;font-size:11px;padding:2px 10px}
  main{max-width:900px;margin:20px auto 60px;padding:0 max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
  nav{display:flex;align-items:center;gap:2px;border-bottom:2px solid #dce0e6;margin:0 0 16px}
  nav .tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:0;padding:8px 14px;font-size:13px;font-weight:600;color:#5b6472;cursor:pointer}
  nav .tab.active{color:#1b1e22;border-bottom-color:#16181c}
  nav .cnt{display:inline-block;min-width:18px;text-align:center;background:#b3261e;color:#fff;border-radius:99px;font-size:11px;padding:0 5px;margin-left:4px}
  #wrapctl{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:#5b6472;cursor:pointer;white-space:nowrap;padding:4px 0}
  .pbar{display:flex;justify-content:flex-end;margin:0 0 12px}
  .card{background:#fff;border:1px solid #dce0e6;border-radius:10px;padding:14px 16px;margin-bottom:12px;scroll-margin-top:16px}
  .card.resolved{opacity:.75}
  .card.focus{border-color:#7a5ea8;box-shadow:0 0 0 3px rgba(122,94,168,.35)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .id{font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#e8ebf0;color:#3d4550}
  .tag.approved{background:#dcf2df;color:#1d7a2e}.tag.rejected{background:#fbe3e3;color:#b3261e}.tag.pending{background:#fdf1de;color:#9a6b00}
  .tag.autorun{background:#fbe3e3;color:#b3261e}.tag.perrun{background:#dcf2df;color:#1d7a2e}
  .risk{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
  .risk-low{background:#dcf2df;color:#1d7a2e}.risk-medium{background:#fdf1de;color:#9a6b00}.risk-high{background:#fbe3e3;color:#b3261e}
  .age{margin-left:auto;font-size:12px;color:#8a93a0}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7a828e;margin-top:10px}
  .lbl a{color:#7a5ea8;text-transform:none;letter-spacing:0}
  .summary{border-left:3px solid #7a5ea8;background:#f7f4fb;border-radius:0 6px 6px 0;padding:8px 12px;margin:8px 0}
  .summary .flags span{display:inline-block;font-size:12px;background:#ece4f7;color:#4d3a75;border-radius:99px;padding:1px 9px;margin:2px 4px 2px 0}
  .claim{border:1.5px dashed #c9a227;background:#fdf9ec;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:13px}
  .claim .lbl{color:#9a6b00;margin-top:0}
  .banner{border-radius:6px;padding:9px 12px;margin:8px 0;font-size:13px}
  .banner.warn{background:#fbe3e3;border:1px solid #eebbb6;color:#7c1a14}
  .banner.info{background:#e8ebf0;border:1px solid #ccd2da;color:#3d4550}
  .banner.prior{background:#fdf1de;border:1px solid #ecd4a0;color:#6b4d00}
  .banner.prior a{color:#6b4d00}
  .actions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
  button{border:0;border-radius:7px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  .ok{background:#1d7a2e;color:#fff}.no{background:#b3261e;color:#fff}
  input[type=text],input[type=password]{flex:1;min-width:180px;border:1px solid #ccd2da;border-radius:7px;padding:7px 10px;font-size:13px}
  .empty{color:#8a93a0;font-style:italic}
  /* code blocks: no-wrap + horizontal scroll by default (it's code); body.wrap flips it */
  .code{position:relative;margin:8px 0}
  .code .copy{position:absolute;top:4px;right:4px;opacity:.8;z-index:1}
  pre.cb{background:#f0f2f5;border:1px solid #e3e6eb;border-radius:6px;padding:8px 0;overflow-x:auto;margin:0;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;line-height:1.5}
  pre.cb.cut{border-radius:6px 6px 0 0;border-bottom:0}
  .cl,.dl{display:flex;padding:0 12px}
  .lno{flex:0 0 30px;text-align:right;padding-right:10px;color:#a3abb6;user-select:none}
  .lct{white-space:pre;flex:1 0 auto}
  body.wrap .lct{white-space:pre-wrap;word-break:break-all;flex:1 1 auto;min-width:0}
  .hl-c{color:#8a93a0}.hl-s{color:#2a7d3a}.hl-v{color:#7a5ea8}
  .dg{flex:0 0 20px;user-select:none;color:#8a93a0;font-weight:700}
  .dl.add{background:#dcf2df}.dl.add .dg{color:#1d7a2e}
  .dl.del{background:#fbe3e3}.dl.del .dg{color:#b3261e}
  .dl.skip{color:#8a93a0;font-style:italic}
  button.mini{background:#e8ebf0;color:#3d4550;font-size:11px;padding:3px 10px;border-radius:6px}
  button.mini:hover{background:#dde2e9}
  button.more{display:block;width:100%;background:#e8ebf0;border:1px solid #e3e6eb;border-top:1px solid #dbe0e7;color:#3d4550;font-size:11px;padding:4px;border-radius:0 0 6px 6px}
  #login{max-width:420px;margin:60px auto;background:#fff;border:1px solid #dce0e6;border-radius:10px;padding:22px}
  #login h2{margin:0 0 8px;font-size:15px}
  #login p{font-size:13px;color:#5b6472;margin:0 0 14px}
  #login form{display:flex;gap:8px}
  #login button{background:#16181c;color:#fff}
  #loginerr{color:#b3261e;font-size:13px;margin-top:10px;min-height:1em}
  @media (max-width:600px){
    header{padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
    header h1{font-size:14px}
    main{margin:14px auto 44px;padding:0 max(10px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-left))}
    nav .tab{padding:8px 10px}
    .card{padding:12px;border-radius:8px}
    pre.cb{font-size:12px}
    input[type=text],input[type=password]{font-size:16px} /* <16px triggers iOS focus-zoom */
    .actions button{flex:1;min-height:44px}
    .actions input[type=text]{flex-basis:100%}
    #login{margin:24px 12px;padding:18px 16px}
    #login form{flex-wrap:wrap}
    #login button{flex:1;min-height:44px}
  }
</style></head>
<body>
<header><h1>Escape Clause broker — approval queue</h1><div id="authstate"></div></header>
<div id="login" hidden>
  <h2>Sign in to review requests</h2>
  <p>The password is on the broker host in <code>~/.escape-clause/secrets/password</code>.
  After signing in, links to individual requests (like the one that brought you here) work directly.</p>
  <form onsubmit="return login(event)">
    <input type="password" id="pw" placeholder="password" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
  </form>
  <div id="loginerr"></div>
</div>
<main hidden>
  <nav>
    <button class="tab" id="tab-pending" onclick="setTab('pending')">Pending</button>
    <button class="tab" id="tab-history" onclick="setTab('history')">History</button>
    <button class="tab" id="tab-policies" onclick="setTab('policies')">Policies</button>
    <label id="wrapctl"><input type="checkbox" id="wrapcb" onchange="toggleWrap(this)"> wrap lines</label>
  </nav>
  <section id="sec-pending"><div class="pbar" id="pendingbar"></div><div id="pending"></div></section>
  <section id="sec-history" hidden><div id="history"></div></section>
  <section id="sec-policies" hidden><div id="policies"></div></section>
</main>
<script>
// Escapes &,<,>,",' — safe as element text and inside double-quoted attributes. The other
// invariant: interpolated ids/names ride in data-* attributes handled by the delegated
// click listener below, never inside inline-JS strings, so there is no JS-string context
// anywhere for a hostile value to break out of.
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s)
  return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function age(iso){if(!iso)return ''
  var s=Math.max(0,(Date.now()-Date.parse(iso))/1000)
  return s<60?Math.round(s)+'s ago':s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'}

var TICKETS=[],POLICIES=[]
var TAB='pending'      // which of pending/history/policies is showing
var EXP={},VIEW={}     // per-block UI state, keyed by stable ids like "REQ-5:cmd" — survives SSE re-renders
var CODE={}            // raw text behind each code block, for the copy buttons (rebuilt every render)
var AUTO={readonly:1,'private-write':1}

// Wrap preference: no-wrap is the default everywhere (it's code); remembered in localStorage.
try{if(localStorage.getItem('ec_wrap')==='1')document.body.classList.add('wrap')}catch(e){}
function toggleWrap(cb){
  document.body.classList.toggle('wrap',cb.checked)
  try{localStorage.setItem('ec_wrap',cb.checked?'1':'0')}catch(e){}
}

// ---------- code blocks ----------
// Shell-quote an argv for the human-readable view. The raw argv stays one toggle away:
// it is the honest form of what execFile actually runs.
function shq(argv){return argv.map(function(w){
  return /^[A-Za-z0-9%+,\-.\/:=@_]+$/.test(w)?w:"'"+String(w).replace(/'/g,"'\\''")+"'"
}).join(' ')}
function argvJson(argv){return '['+argv.map(function(w){return '\n  '+JSON.stringify(w)}).join(',')+'\n]'}

// Tiny best-effort shell highlighter: strings, comments, $variables. Cosmetic only.
function hlSh(line){
  var re=/("(?:[^"\\]|\\.)*"?)|('[^']*'?)|((?:^|\s)#.*$)|(\$\{[^}]*\}|\$\w+|\$[@*#?$!-])/g
  var out='',last=0,m
  while((m=re.exec(line))){
    out+=esc(line.slice(last,m.index))
    out+='<span class="hl-'+(m[3]?'c':m[4]?'v':'s')+'">'+esc(m[0])+'</span>'
    last=m.index+m[0].length
  }
  return out+esc(line.slice(last))
}

// One code block: line numbers, optional sh highlighting, copy button, and collapse to
// the first 5 lines when longer than 8 (expand/collapse toggled per block).
function codeBlock(id,text,opts){
  opts=opts||{}
  var raw=String(text==null?'':text)
  CODE[id]=raw
  var lines=raw.replace(/\n+$/,'').split('\n')
  var cut=opts.collapse!==false&&lines.length>8&&!EXP[id]
  var shown=cut?lines.slice(0,5):lines
  var h='<div class="code"><button class="mini copy" data-act="copy" data-id="'+esc(id)+'">copy</button>'
  h+='<pre class="cb'+(cut?' cut':'')+'">'
  for(var i=0;i<shown.length;i++){
    var body=opts.sh?hlSh(shown[i]):esc(shown[i])
    h+='<div class="cl">'+(opts.nums?'<span class="lno">'+(i+1)+'</span>':'')
    h+='<span class="lct">'+(body||'\u200b')+'</span></div>' // zwsp keeps empty lines their height
  }
  h+='</pre>'
  if(cut)h+='<button class="more" data-act="exp" data-id="'+esc(id)+'">▾ show all '+lines.length+' lines</button>'
  else if(opts.collapse!==false&&lines.length>8)h+='<button class="more" data-act="exp" data-id="'+esc(id)+'">▴ collapse</button>'
  return h+'</div>'
}
function toggleExp(id){EXP[id]=!EXP[id];renderAll()}
function setView(id,v){VIEW[id]=v;renderAll()}
function copyCode(btn,id){
  var txt=CODE[id]||''
  function done(ok){btn.textContent=ok?'copied':'copy failed';setTimeout(function(){btn.textContent='copy'},1200)}
  function fallback(){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0'
    document.body.appendChild(ta);ta.select()
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);return ok
  }
  if(navigator.clipboard&&window.isSecureContext)
    navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(fallback())})
  else done(fallback())
}

// ---------- diffs ----------
// Plain LCS line diff — scripts here are small. Returns [{t:' '|'-'|'+',s}] or null if huge.
function diffLines(a,b){
  var A=String(a).replace(/\n+$/,'').split('\n'),B=String(b).replace(/\n+$/,'').split('\n')
  var n=A.length,m=B.length
  if(n*m>250000)return null
  var L=[],i,j
  for(i=n;i>=0;i--){L[i]=[];for(j=m;j>=0;j--)
    L[i][j]=i===n||j===m?0:A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1])}
  var out=[],x=0,y=0
  while(x<n&&y<m){
    if(A[x]===B[y]){out.push({t:' ',s:A[x]});x++;y++}
    else if(L[x+1][y]>=L[x][y+1]){out.push({t:'-',s:A[x]});x++}
    else{out.push({t:'+',s:B[y]});y++}
  }
  while(x<n)out.push({t:'-',s:A[x++]})
  while(y<m)out.push({t:'+',s:B[y++]})
  return out
}
// Render a diff keeping 2 context lines around each change; longer equal runs collapse.
function diffBlock(ops){
  var keep=[],i,j
  for(i=0;i<ops.length;i++)if(ops[i].t!==' ')
    for(j=Math.max(0,i-2);j<=Math.min(ops.length-1,i+2);j++)keep[j]=true
  var h='<pre class="cb">',skip=0
  function flush(){if(skip){h+='<div class="dl skip"><span class="dg"></span><span class="lct">⋯ '+skip+' unchanged line'+(skip>1?'s':'')+'</span></div>';skip=0}}
  for(i=0;i<ops.length;i++){
    if(!keep[i]){skip++;continue}
    flush()
    var o=ops[i]
    h+='<div class="dl '+(o.t==='+'?'add':o.t==='-'?'del':'')+'"><span class="dg">'+(o.t===' '?'':o.t)+'</span>'
    h+='<span class="lct">'+(esc(o.s)||'\u200b')+'</span></div>'
  }
  flush()
  return h+'</pre>'
}

// ---------- "you already denied something like this" ----------
function reqText(t){
  if(t.kind==='command')return (t.command||[]).join(' ')
  if(t.kind==='policy')return t.policy+' '+(t.args||[]).join(' ')
  if(t.kind==='policy-registration')return t.registration.name+'\n'+t.registration.script
  return ''
}
// Token overlap (Sørensen–Dice on whitespace tokens) — cheap and good enough to catch
// "same request, small tweak" retries without flagging unrelated commands.
function similarity(a,b){
  if(a===b)return 1
  var A=String(a).toLowerCase().split(/\s+/).filter(Boolean)
  var B=String(b).toLowerCase().split(/\s+/).filter(Boolean)
  if(!A.length||!B.length)return 0
  var c={},i,hit=0
  for(i=0;i<A.length;i++)c[A[i]]=(c[A[i]]||0)+1
  for(i=0;i<B.length;i++)if(c[B[i]]){c[B[i]]--;hit++}
  return 2*hit/(A.length+B.length)
}
// Most similar rejected ticket of the same kind from the last 24h, if similarity >= 0.6.
function priorDenial(t){
  var txt=reqText(t);if(!txt)return null
  var best=null,bs=0,i
  for(i=0;i<TICKETS.length;i++){var o=TICKETS[i]
    if(o.ticket===t.ticket||o.status!=='rejected'||o.kind!==t.kind)continue
    if(Date.parse(t.created)-Date.parse(o.created||0)>86400e3)continue
    var s=similarity(txt,reqText(o))
    if(s>bs){bs=s;best=o}
  }
  return best&&bs>=0.6?{prev:best,identical:reqText(best)===txt}:null
}
function priorBox(t){
  if(t.status!=='pending')return ''
  var p=priorDenial(t);if(!p)return ''
  var prev=p.prev
  var h='<div class="banner prior"><b>⚠ '+(p.identical?'Identical to':'Similar to')+' '
  h+='<a href="#" data-act="focus" data-id="'+esc(prev.ticket)+'">'+esc(prev.ticket)+'</a></b>, which you denied '+age(prev.resolved||prev.created)
  if(prev.note)h+=' with the note “'+esc(prev.note)+'”'
  h+='.'
  if(!p.identical){
    var d=diffLines(reqText(prev),reqText(t))
    if(d)h+='<div class="lbl">What changed vs '+esc(prev.ticket)+'</div>'+diffBlock(d)
  }
  return h+'</div>'
}
function byId(id){for(var i=0;i<TICKETS.length;i++)if(TICKETS[i].ticket===id)return TICKETS[i];return null}
function focusTicket(id){
  var t=byId(id)
  setTab(t&&t.status==='pending'?'pending':'history')
  var el=document.getElementById('t-'+id)
  if(el){el.classList.add('focus');el.scrollIntoView({behavior:'smooth',block:'center'})}
}

// ---------- ticket cards ----------
function facts(t){
  var h=''
  if(t.kind==='permission'){
    h+='<div class="lbl">Claude Code permission request — '+esc(t.tool_name)+' (relayed from the terminal)</div>'
    h+='<div>'+esc(t.description||'(no description)')+'</div>'
    if(t.input_preview)h+='<div class="lbl">Input preview (agent-chosen)</div>'+codeBlock(t.ticket+':inp',t.input_preview,{})
    h+='<div class="lbl" style="color:#9a6b00">Answering here is parallel to the terminal dialog — whichever answers first wins.</div>'
  }
  if(t.kind==='command'){
    var cid=t.ticket+':cmd',rawv=VIEW[cid]==='argv'
    h+='<div class="lbl">Exact command — approving runs exactly this '
    h+='<a href="#" data-act="view" data-id="'+esc(cid)+'" data-v="'+(rawv?'':'argv')+'">'+(rawv?'shell view':'raw argv')+'</a></div>'
    h+=codeBlock(cid,rawv?argvJson(t.command||[]):shq(t.command||[]),rawv?{}:{sh:true})
  }
  if(t.kind==='policy'){
    h+='<div class="lbl">Policy run — approving runs the installed script once with these args '
    h+='<a href="#" data-act="policy" data-id="'+esc(t.policy)+'">view installed script →</a></div>'
    h+=codeBlock(t.ticket+':prun',shq([t.policy].concat((t.args||[]).map(String))),{sh:true})
    h+='<div class="row" style="margin-top:6px"><span class="tag">class: '+esc(t.policyClass)+'</span><span class="tag perrun">each run needs approval</span></div>'
  }
  if(t.kind==='policy-registration')h+=regFacts(t)
  return h
}
function regFacts(t){
  var r=t.registration,isUpdate=r.previousScript!=null
  var h='<div class="lbl">'+(isUpdate?'Policy UPDATE':'New policy')+': '+esc(r.name)+' (class: '+esc(r.class)+')</div>'
  h+='<div>'+esc(r.description)+'</div>'
  var inst=null,i
  for(i=0;i<POLICIES.length;i++)if(POLICIES[i].name===r.name)inst=POLICIES[i]
  if(inst&&inst.class!==r.class)h+='<div class="banner warn"><b>Class change:</b> currently installed as '+esc(inst.class)+', this proposes '+esc(r.class)+'.</div>'
  if(AUTO[r.class])h+='<div class="banner warn"><b>⚠ Auto-run class ('+esc(r.class)+'):</b> once '+(isUpdate?'updated':'installed')+', every future run of this policy executes immediately with NO per-run review. Approving this script is the review.</div>'
  else h+='<div class="banner info">Class '+esc(r.class)+': each run of this policy will still need human approval.</div>'
  if(isUpdate){
    var vid=t.ticket+':reg',full=VIEW[vid]==='full'
    h+='<div class="lbl">'+(full?'Proposed script (full)':'Changes vs installed script')+' '
    h+='<a href="#" data-act="view" data-id="'+esc(vid)+'" data-v="'+(full?'':'full')+'">'+(full?'view diff':'view full script')+'</a></div>'
    if(full)h+=codeBlock(vid+':s',r.script,{nums:true,sh:true})
    else{
      var d=diffLines(r.previousScript,r.script)
      h+=d?diffBlock(d):codeBlock(vid+':s',r.script,{nums:true,sh:true})
    }
  }else{
    h+='<div class="lbl">Proposed script</div>'+codeBlock(t.ticket+':reg:s',r.script,{nums:true,sh:true})
  }
  return h
}
function summary(t){
  if(!t.summary) return '<div class="lbl">AI risk summary</div><div class="summary" style="color:#8a93a0">'+(t.status==='pending'?'pending or unavailable — review the raw facts above':'unavailable')+'</div>'
  var s=t.summary
  var h='<div class="lbl">AI risk summary (broker-owned reviewer — advisory only)</div><div class="summary">'
  h+='<span class="risk risk-'+esc(s.risk)+'">'+esc(s.risk.toUpperCase())+'</span> '+esc(s.what_it_does)
  if(s.flags&&s.flags.length){h+='<div class="flags">';for(var i=0;i<s.flags.length;i++)h+='<span>'+esc(s.flags[i])+'</span>';h+='</div>'}
  if(s.exfil_note)h+='<div><b>Exfil:</b> '+esc(s.exfil_note)+'</div>'
  return h+'</div>'
}
function card(t){
  var h='<div class="card'+(t.status==='pending'?'':' resolved')+'" id="t-'+esc(t.ticket)+'"><div class="row">'
  h+='<span class="id">'+esc(t.ticket)+'</span><span class="tag">'+esc(t.kind)+'</span>'
  h+='<span class="tag '+esc(t.status)+'">'+esc(t.status)+'</span>'
  h+='<span class="age" title="'+esc(t.created)+'">'+age(t.created)+'</span></div>'
  h+=facts(t)+priorBox(t)+summary(t)
  h+='<div class="claim"><div class="lbl">Agent’s claim (untrusted — may be attacker-controlled)</div>'+esc(t.reason||'(none)')+'</div>'
  if(t.status==='pending'){
    h+='<div class="actions"><button class="ok" data-act="approve" data-id="'+esc(t.ticket)+'">Approve once</button>'
    h+='<button class="no" data-act="deny" data-id="'+esc(t.ticket)+'">Deny</button>'
    h+='<input type="text" id="msg-'+esc(t.ticket)+'" placeholder="optional message back to the agent (sent on deny)"></div>'
  } else {
    if(t.note)h+='<div class="lbl">Decision note</div><div>'+esc(t.note)+'</div>'
    if(t.output)h+='<div class="lbl">Output</div>'+codeBlock(t.ticket+':out',t.output,{})
  }
  return h+'</div>'
}

// ---------- policies tab ----------
function policyCard(p){
  var auto=!!AUTO[p.class]
  var h='<div class="card" id="p-'+esc(p.name)+'"><div class="row">'
  h+='<span class="id">'+esc(p.name)+'</span><span class="tag">'+esc(p.class)+'</span>'
  h+='<span class="tag '+(auto?'autorun':'perrun')+'">'+(auto?'auto-runs without review':'each run needs approval')+'</span>'
  h+='<span class="age" title="'+esc(p.installedAt||'')+'">installed '+age(p.installedAt)+'</span></div>'
  h+='<div>'+esc(p.description)+'</div>'
  h+='<div class="lbl">Installed script</div>'
  h+=p.script!=null?codeBlock('p-'+p.name+':script',p.script,{nums:true,sh:true}):'<div class="empty">script file missing from the policy store</div>'
  return h+'</div>'
}
function showPolicy(name){
  EXP['p-'+name+':script']=true
  setTab('policies')
  var el=document.getElementById('p-'+name)
  if(el){el.classList.add('focus');el.scrollIntoView({behavior:'smooth',block:'center'})}
}
// Delegated handler for every per-item control (see esc() note): the ids live in data-*
// attributes, so nothing ticket- or policy-derived is ever parsed as JS.
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]')
  if(!el)return
  if(el.tagName==='A')ev.preventDefault()
  var id=el.getAttribute('data-id')
  switch(el.getAttribute('data-act')){
    case 'copy':copyCode(el,id);break
    case 'exp':toggleExp(id);break
    case 'view':setView(id,el.getAttribute('data-v')||'');break
    case 'policy':showPolicy(id);break
    case 'focus':focusTicket(id);break
    case 'approve':act(id,'approve');break
    case 'deny':act(id,'deny');break
    case 'denyall':denyAll(Number(el.getAttribute('data-n'))||0);break
  }
})

// ---------- tabs + render ----------
function setTab(name){TAB=name;renderAll()}
function renderAll(){
  CODE={}
  // Re-renders can land at any moment (SSE updates, expand/view toggles) — carry any
  // half-typed deny message (and its focus) across the innerHTML rebuild.
  var saved={},mi,msgs=document.querySelectorAll('input[id^="msg-"]')
  var focused=document.activeElement&&/^msg-/.test(document.activeElement.id||'')?document.activeElement.id:null
  for(mi=0;mi<msgs.length;mi++)if(msgs[mi].value)saved[msgs[mi].id]=msgs[mi].value
  var p=TICKETS.filter(function(t){return t.status==='pending'})
  var r=TICKETS.filter(function(t){return t.status!=='pending'})
  document.getElementById('tab-pending').innerHTML='Pending'+(p.length?'<span class="cnt">'+p.length+'</span>':'')
  document.getElementById('tab-history').textContent='History'
  document.getElementById('tab-policies').textContent='Policies'
  var tabs=['pending','history','policies']
  for(var i=0;i<tabs.length;i++){
    document.getElementById('tab-'+tabs[i]).classList.toggle('active',TAB===tabs[i])
    document.getElementById('sec-'+tabs[i]).hidden=TAB!==tabs[i]
  }
  document.getElementById('pendingbar').innerHTML=p.length>=2
    ?'<button class="no" data-act="denyall" data-n="'+p.length+'">Deny all '+p.length+' pending</button>':''
  document.getElementById('pending').innerHTML=p.length?p.map(card).join(''):'<div class="empty">nothing waiting on you</div>'
  document.getElementById('history').innerHTML=r.length?r.map(card).join(''):'<div class="empty">no resolved requests yet</div>'
  document.getElementById('policies').innerHTML=POLICIES.length?POLICIES.map(policyCard).join(''):'<div class="empty">no policies installed</div>'
  document.getElementById('wrapcb').checked=document.body.classList.contains('wrap')
  for(var k in saved){var inp=document.getElementById(k);if(inp)inp.value=saved[k]}
  if(focused){var fe=document.getElementById(focused)
    if(fe){fe.focus();fe.setSelectionRange(fe.value.length,fe.value.length)}}
  focusReq()
}
// The agent-shared link is <ui base>/?req=REQ-N — highlight that request (in whichever
// tab it lives; showQueue picks the tab on first load).
var focusedOnce=false
function focusReq(){
  var req=new URLSearchParams(location.search).get('req');if(!req)return
  var el=document.getElementById('t-'+req);if(!el)return
  el.classList.add('focus')
  if(!focusedOnce){focusedOnce=true;el.scrollIntoView({behavior:'smooth',block:'center'})}
}

// ---------- auth + data flow ----------
var sse=null
function showLogin(){
  document.getElementById('login').hidden=false
  document.querySelector('main').hidden=true
  document.getElementById('authstate').textContent='signed out'
  if(sse){sse.close();sse=null}
}
function showQueue(){
  document.getElementById('login').hidden=true
  document.querySelector('main').hidden=false
  document.getElementById('authstate').innerHTML='signed in &nbsp;<button onclick="logout()">sign out</button>'
  if(!focusedOnce){ // a ?req= link to an already-resolved ticket lives in the History tab
    var req=new URLSearchParams(location.search).get('req')
    var t=req&&byId(req)
    if(t&&t.status!=='pending')TAB='history'
  }
  renderAll()
  if(!sse){sse=new EventSource('/events');sse.onmessage=load}
}
function load(){
  Promise.all([fetch('/api/tickets'),fetch('/api/policies')]).then(function(rs){
    if(rs[0].status===401||rs[1].status===401){showLogin();return null}
    return Promise.all([rs[0].json(),rs[1].json()])
  }).then(function(d){if(d){TICKETS=d[0];POLICIES=d[1];showQueue()}})
}
function login(ev){
  ev.preventDefault()
  var pw=document.getElementById('pw').value
  fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})})
    .then(function(r){
      if(r.ok){document.getElementById('pw').value='';document.getElementById('loginerr').textContent='';load()}
      else r.text().then(function(t){document.getElementById('loginerr').textContent=t})
    })
  return false
}
function logout(){fetch('/api/logout',{method:'POST'}).then(function(){showLogin()})}
function act(id,verdict){
  var msg=(document.getElementById('msg-'+id)||{}).value||''
  fetch('/api/tickets/'+id+'/'+verdict,{method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({message:msg})
  }).then(function(r){if(!r.ok)return r.text().then(function(t){alert(verdict+' failed: '+t)});load()})
}
function denyAll(n){
  if(!confirm('Deny all '+n+' pending requests (including any relayed permission prompts)? The agent is told to re-request anything it still needs.'))return
  fetch('/api/tickets/deny-all',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})
    .then(function(r){if(!r.ok)return r.text().then(function(t){alert('deny all failed: '+t)});load()})
}
load()
</script>
